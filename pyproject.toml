[project]
name = "git-to-confluence"
version = "0.1.0"
description = "Scripts to push Markdown to Confluence"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "atlassian-python-api",
    "beautifulsoup4",
    "requests",
    "thefuzz",
    "python-levenshtein",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["push_to_confluence"]
